name: Weekly AI & MCP Candidate Discovery

# 매주 월요일 오전 9시(한국시간 기준, UTC 00:00) 자동 실행 또는 GitHub 웹에서 수동 실행 지원
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 신규 모델 및 MCP 자동 탐색 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/search_candidates.py

      - name: 변경 사항 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 주간 자동 탐색 신규 AI/MCP 후보 업데이트 [skip ci]" && git push)
